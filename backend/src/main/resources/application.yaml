spring:
  application:
    name: echo-grove-backend
  config:
    # Local secrets (ADMIN_EMAIL, ADMIN_PASSWORD, JWT_SECRET, POSTGRES_PASSWORD) live in backend/.env, which git ignores.
    import: optional:file:.env[.properties]
  docker:
    compose:
      # Development: `mvn spring-boot:run` starts compose.yaml (Postgres) and connects to it automatically.
      lifecycle-management: start-only
  datasource:
    # Live server: set SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME and SPRING_DATASOURCE_PASSWORD
    # to a hosted PostgreSQL database (Docker Compose support is not included in the packaged jar).
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  jackson:
    mapper:
      # Lets the frontend send "spring" or "SPRING"
      accept-case-insensitive-enums: true
  # Mail: set SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD,
  # SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH=true and SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE=true.
  # Without them, verification links are printed to the server log (development).

server:
  port: ${PORT:8085}
  forward-headers-strategy: native
  error:
    include-stacktrace: never
  compression:
    enabled: true
    mime-types: application/json,application/problem+json
  tomcat:
    threads:
      max: 50

echogrove:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  cors:
    # Comma-separated. Add the deployed frontend URL through ALLOWED_ORIGINS.
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  jwt:
    # At least 32 characters. If missing, a random key is used and logins end on restart.
    secret: ${JWT_SECRET:}
    ttl-minutes: 60
  mail:
    from: ${MAIL_FROM:Echo Grove <no-reply@echogrove.app>}
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  rate-limit:
    enabled: true

